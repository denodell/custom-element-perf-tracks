name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test 2>&1 | tee test-output.log; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: failure()
        run: node .github/annotate-test-failures.mjs test-output.log

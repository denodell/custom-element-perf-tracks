<!doctype html>
<meta charset="utf-8">
<title>browser scenarios</title>
<script>
  // ?lit=2 runs every scenario against Lit 2 instead of Lit 3.
  const lit2 = new URLSearchParams(location.search).get("lit") === "2";
  const base = lit2 ? "/node_modules/lit2/node_modules/" : "/node_modules/";
  const lit = lit2 ? "/node_modules/lit2/" : "/node_modules/lit/";
  const map = document.createElement("script");
  map.type = "importmap";
  map.textContent = JSON.stringify({
    imports: {
      "lit": lit + "index.js",
      "lit/": lit,
      "lit-html": base + "lit-html/lit-html.js",
      "lit-html/": base + "lit-html/",
      "lit-element/": base + "lit-element/",
      "@lit/reactive-element": base + "@lit/reactive-element/reactive-element.js",
      "@lit/reactive-element/": base + "@lit/reactive-element/",
    },
  });
  document.currentScript.after(map);
</script>
<body>
<script type="module">
  // Each scenario returns plain data; test/browser.test.mjs makes the assertions.
  // Bars are read back through PerformanceObserver, so these run with the
  // "measure" strategy, which keeps every bar in the buffer. Bars with no
  // length are not drawn, so test components do a little work (work(0.3)).
  import { configure, getConfig, definePerf, instrumentAll, instrumentElement, emit } from "/dist/index.js";
  import { trackLitUpdates } from "/dist/adapters/lit.js";
  import { LitElement, html } from "lit";

  configure({ strategy: "measure", minDuration: 0 });

  const bars = [];
  new PerformanceObserver((list) => {
    for (const e of list.getEntries()) {
      const d = e.detail?.devtools;
      if (d) bars.push({
        name: e.name,
        track: d.track,
        color: d.color,
        rows: d.properties ?? [],
        props: Object.fromEntries(d.properties ?? []),
        start: e.startTime,
        end: e.startTime + e.duration,
        duration: e.duration,
      });
    }
  }).observe({ type: "measure" });

  const frame = () => new Promise((r) => setTimeout(r, 30));
  const work = (ms) => { const end = performance.now() + ms; while (performance.now() < end) {} };
  async function collect(fn) {
    await frame();
    bars.length = 0;
    await fn();
    await frame();
    return bars.splice(0);
  }
  const on = (track, list) => list.filter((b) => b.track === track);
  const names = (list) => list.map((b) => b.name);

  const scenarios = {
    // ---- Drawing ---------------------------------------------------------

    async autoStrategyLeavesBufferAlone() {
      configure({ strategy: "auto" });
      performance.measure("auto-el", { start: 0, end: 1 });
      const before = performance.getEntriesByType("measure").length;
      // One bar with details (measure, then cleared) and one without (timeStamp).
      emit("auto-el", performance.now() - 2, performance.now(), { track: "Components", properties: [["k", "v"]] });
      emit("auto-el", performance.now() - 2, performance.now(), { track: "Components" });
      const after = performance.getEntriesByType("measure").length;
      const userMeasureKept = performance.getEntriesByName("auto-el").length;
      configure({ strategy: "measure" });
      return { added: after - before, userMeasureKept };
    },

    async timestampStrategyAddsNothingToBuffer() {
      configure({ strategy: "timestamp" });
      const before = performance.getEntriesByType("measure").length;
      emit("ts thing", performance.now() - 2, performance.now(), { track: "Components", properties: [["k", "v"]] });
      const after = performance.getEntriesByType("measure").length;
      configure({ strategy: "measure" });
      return after - before;
    },

    // ---- Lifecycle callbacks -------------------------------------------

    async lifecycleOnComponentsTrack() {
      class LcEl extends HTMLElement { connectedCallback() { work(1); } disconnectedCallback() { work(1); } }
      definePerf("lc-el", LcEl);
      const el = document.createElement("lc-el");
      const got = await collect(() => { document.body.append(el); el.remove(); });
      return on("Components", got).map((b) => [b.name, b.color]);
    },

    async inheritanceBaseFirst() {
      class BaseA extends HTMLElement { connectedCallback() { work(1); } }
      class SubA extends BaseA { connectedCallback() { super.connectedCallback(); } }
      definePerf("base-a", BaseA);
      definePerf("sub-a", SubA);
      return names(on("Components", await collect(() => document.body.append(document.createElement("sub-a")))));
    },

    async inheritanceSubFirst() {
      class BaseB extends HTMLElement { connectedCallback() { work(1); } }
      class SubB extends BaseB {}
      definePerf("sub-b", SubB);
      definePerf("base-b", BaseB);
      return names(on("Components", await collect(() => {
        document.body.append(document.createElement("sub-b"));
        document.body.append(document.createElement("base-b"));
      })));
    },

    async shortCallbacksHidden() {
      // Browsers round timestamps to 0.1 ms, so use a cut-off well above that.
      configure({ minDuration: 0.5 });
      class Quick extends HTMLElement { connectedCallback() {} }
      class Slow extends HTMLElement { connectedCallback() { work(1); } }
      definePerf("quick-el", Quick);
      definePerf("slow-el", Slow);
      const got = await collect(() => {
        document.body.append(document.createElement("quick-el"));
        document.body.append(document.createElement("slow-el"));
      });
      configure({ minDuration: 0 });
      return names(on("Components", got));
    },

    async failedDefineLeavesClassAlone() {
      class Taken extends HTMLElement { connectedCallback() {} }
      customElements.define("taken-el", class extends HTMLElement {});
      const before = Taken.prototype.connectedCallback;
      let threw = null;
      try { definePerf("taken-el", Taken); } catch (e) { threw = e.name; }
      return { threw, untouched: Taken.prototype.connectedCallback === before };
    },

    async upgradeCountIncludesShadowRoots() {
      const host = document.createElement("div");
      const root = host.attachShadow({ mode: "open" });
      for (let i = 0; i < 5; i++) root.append(document.createElement("shadow-kid"));
      for (let i = 0; i < 3; i++) document.body.append(document.createElement("shadow-kid"));
      document.body.append(host);
      class ShadowKid extends HTMLElement { connectedCallback() {} }
      const got = await collect(() => definePerf("shadow-kid", ShadowKid));
      const bar = on("Upgrade", got)[0];
      return { name: bar?.name, count: bar?.props["Elements upgraded"] };
    },

    async throwingCallback() {
      class Boom extends HTMLElement { connectedCallback() { throw new TypeError("kaboom"); } }
      definePerf("boom-el", Boom);
      const el = new Boom();
      let message = null;
      const got = await collect(() => { try { el.connectedCallback(); } catch (e) { message = e.message; } });
      return { message, bars: got.map((b) => [b.color, b.props.Error]) };
    },

    async attributeDiff() {
      class AttrEl extends HTMLElement { static observedAttributes = ["x"]; attributeChangedCallback() { work(0.3); } }
      definePerf("attr-el", AttrEl);
      const el = document.createElement("attr-el");
      el.setAttribute("x", "1");
      const got = await collect(() => el.removeAttribute("x"));
      return { name: got[0]?.name, rows: got[0]?.rows };
    },

    async instrumentAfterDefineWarns() {
      class Late extends HTMLElement { connectedCallback() {} }
      customElements.define("late-el", Late);
      const warnings = [];
      const warn = console.warn;
      console.warn = (m) => warnings.push(String(m));
      instrumentElement(Late);
      console.warn = warn;
      return warnings.length;
    },

    // ---- Lit -----------------------------------------------------------

    async litFirstUpdate() {
      class LitFirst extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 1; trackLitUpdates(this); }
        render() { work(1); return html`${this.v}`; }
        firstUpdated() { work(1); }
      }
      customElements.define("lit-first", LitFirst);
      const el = new LitFirst();
      await new Promise((r) => setTimeout(r, 40)); // created, then connected later
      const got = await collect(async () => { document.body.append(el); await el.updateComplete; });
      const components = on("Components", got);
      const mount = components.find((b) => b.name === "Mount");
      return {
        scheduler: names(on("Scheduler", got)),
        components: names(components),
        mountWrapsAll: components.every((b) => b.start >= mount.start && b.end <= mount.end),
        updateWait: on("Scheduler", got).find((b) => b.name.startsWith("Update"))?.duration,
        changedPropsOnFirst: components.some((b) => "Changed Props" in b.props),
      };
    },

    async litPhasesAndChangedProps() {
      class LitA extends LitElement {
        static properties = { a: { type: Number }, b: { type: String } };
        constructor() { super(); this.a = 0; this.b = "x"; trackLitUpdates(this); }
        willUpdate() { work(4); }
        render() { work(4); return html`${this.a}${this.b}`; }
        updated() { work(4); }
      }
      customElements.define("lit-a", LitA);
      const el = new LitA();
      document.body.append(el);
      await el.updateComplete;
      await frame();

      const five = await collect(async () => { for (let i = 0; i < 5; i++) el.a++; await el.updateComplete; });
      const noop = await collect(async () => { el.b = "x"; el.b = "x"; el.requestUpdate(); await el.updateComplete; });

      const sched = on("Scheduler", five);
      const render = sched.find((b) => b.name === "Render");
      const commit = sched.find((b) => b.name === "Commit");
      const comps = on("Components", five).filter((b) => b.name === "lit-a");
      return {
        scheduler: names(sched),
        renderBeforeCommit: render.end <= commit.start + 0.001,
        renderMs: render.duration,
        commitMs: commit.duration,
        componentBars: comps.length,
        renderRows: comps[0].rows,
        effectColor: comps[1]?.color,
        noopRows: on("Components", noop).find((b) => b.name === "lit-a")?.rows,
      };
    },

    async litUpdateBlockedAndEvent() {
      class LitE extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`<button @click=${this.onClick}>${this.v}</button>`; }
        onClick() { work(3); this.v++; work(8); } // busy before and after the change
      }
      customElements.define("lit-e", LitE);
      const el = new LitE();
      document.body.append(el);
      await el.updateComplete;
      const got = await collect(async () => { el.renderRoot.querySelector("button").click(); await el.updateComplete; });
      const sched = on("Scheduler", got);
      return {
        scheduler: names(sched),
        eventMs: sched.find((b) => b.name === "Event: click")?.duration,
        updateRows: sched.find((b) => b.name === "Update Blocked")?.rows,
      };
    },

    async litTriggeredByParent() {
      class LitChild extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.v}`; }
      }
      class LitParent extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`<lit-child .v=${this.v}></lit-child>`; }
      }
      customElements.define("lit-child", LitChild);
      customElements.define("lit-parent", LitParent);
      const el = new LitParent();
      document.body.append(el);
      await el.updateComplete;
      await frame();
      const child = el.renderRoot.querySelector("lit-child");
      const got = await collect(async () => { el.v++; await el.updateComplete; await child.updateComplete; });
      return {
        scheduler: names(on("Scheduler", got)),
        childRows: on("Components", got).find((b) => b.name === "lit-child")?.rows,
      };
    },

    async litCascadingUpdate() {
      class LitCascade extends LitElement {
        static properties = { v: { type: Number }, doubled: { type: Number } };
        constructor() { super(); this.v = 0; this.doubled = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.doubled}`; }
        updated(changed) { if (changed.has("v")) this.doubled = this.v * 2; } // the mistake Lit warns about
      }
      customElements.define("lit-cascade", LitCascade);
      const el = new LitCascade();
      document.body.append(el);
      await el.updateComplete;
      await el.updateComplete;
      await frame();
      const got = await collect(async () => { el.v = 5; await el.updateComplete; await el.updateComplete; });
      const sched = on("Scheduler", got);
      const cascade = sched.find((b) => b.name === "Cascading Update");
      const inside = sched.filter((b) => b !== cascade && b.start >= cascade.start - 0.001 && b.end <= cascade.end + 0.001);
      return {
        scheduler: names(sched),
        color: cascade?.color,
        rows: cascade?.rows,
        nested: names(inside),
      };
    },

    async litSkippedAndFailed() {
      class LitC extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; this.skip = false; this.fail = false; trackLitUpdates(this); }
        shouldUpdate() { work(0.3); return !this.skip; }
        render() { work(0.3); if (this.fail) { this.fail = false; throw new Error("render broke"); } return html`${this.v}`; }
      }
      customElements.define("lit-c", LitC);
      const el = new LitC();
      document.body.append(el);
      await el.updateComplete;
      await frame();
      const out = [];
      out.push(...await collect(async () => { el.skip = true; el.v++; el.v++; await el.updateComplete; el.skip = false; }));
      out.push(...await collect(async () => { el.fail = true; el.v++; try { await el.updateComplete; } catch {} }));
      out.push(...await collect(async () => { el.v++; await el.updateComplete; }));
      // Leave out effects bars: under load, the empty updated() can take long
      // enough to get one.
      return on("Components", out)
        .filter((b) => !b.color.startsWith("secondary"))
        .map((b) => [b.name, b.color, b.props["Changes batched"] ?? "1", b.props.Error ?? null]);
    },

    // ---- Fixes from review ----------------------------------------------

    async badValuesDoNotBreakUpdates() {
      class LitBad extends LitElement {
        static properties = { when: { attribute: false }, boom: { attribute: false } };
        constructor() { super(); this.when = new Date(0); trackLitUpdates(this); }
        render() { work(0.3); return html`x`; }
      }
      customElements.define("lit-bad", LitBad);
      const el = new LitBad();
      document.body.append(el);
      await el.updateComplete;
      let error = null;
      const got = await collect(async () => {
        el.when = new Date("not a date");
        try { await el.updateComplete; } catch (e) { error = e.message; }
      });
      return { error, rows: on("Components", got).find((b) => b.name === "lit-bad")?.rows };
    },

    async changeDuringCommitIsCascade() {
      const { ref } = await import("lit/directives/ref.js");
      class LitRef extends LitElement {
        static properties = { v: { type: Number }, measured: { state: true } };
        constructor() { super(); this.v = 0; this.measured = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`<span ${ref((node) => { if (node && this.v) this.measured = this.v * 10; })}>${this.measured}</span>`; }
      }
      customElements.define("lit-ref", LitRef);
      const el = new LitRef();
      document.body.append(el);
      await el.updateComplete;
      await frame();
      const got = await collect(async () => { el.v = 1; await el.updateComplete; await el.updateComplete; });
      const sched = on("Scheduler", got);
      return {
        cascadeRows: sched.find((b) => b.name === "Cascading Update")?.rows,
        secondRenderRows: on("Components", got).filter((b) => b.name === "lit-ref").map((b) => b.rows).find((r) => r.some(([k]) => k.endsWith("measured"))),
      };
    },

    async nestedPerformUpdateKeepsOuter() {
      class LitSelf extends LitElement {
        static properties = { a: { type: Number } };
        constructor() { super(); this.a = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.a}`; }
        updated() { if (this.a === 1) { this.a = 2; this.performUpdate(); } }
      }
      customElements.define("lit-self", LitSelf);
      const el = new LitSelf();
      document.body.append(el);
      await el.updateComplete;
      await frame();
      const got = await collect(async () => { el.a = 1; await el.updateComplete; await frame(); });
      return names(on("Components", got));
    },

    async updateBarBelongsToEachElement() {
      class LitX extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.v}`; }
      }
      class LitLater extends LitX {
        // Updates a frame later, like an element that defers its updates.
        scheduleUpdate() { return new Promise((r) => requestAnimationFrame(r)).then(() => super.scheduleUpdate()); }
      }
      customElements.define("lit-x", LitX);
      customElements.define("lit-later", LitLater);
      const later = new LitLater();
      const x = new LitX();
      document.body.append(later, x);
      await later.updateComplete;
      await x.updateComplete;
      await frame();
      const got = await collect(async () => {
        later.v = 1;
        work(2);
        x.v = 1;
        work(2);
        await x.updateComplete;
        await later.updateComplete;
      });
      return on("Scheduler", got)
        .filter((b) => b.name.startsWith("Update"))
        .map((b) => b.props["Component name"]);
    },

    async changeEventInShadowDom() {
      class LitCheck extends LitElement {
        static properties = { checked: { type: Boolean } };
        constructor() { super(); this.checked = false; trackLitUpdates(this); }
        render() { work(0.3); return html`<input type="checkbox" @change=${(e) => { work(1); this.checked = e.target.checked; }}>`; }
      }
      customElements.define("lit-check", LitCheck);
      const el = new LitCheck();
      document.body.append(el);
      await el.updateComplete;
      const box = el.renderRoot.querySelector("input");
      const got = await collect(async () => { box.click(); await el.updateComplete; });
      return names(on("Scheduler", got)).filter((n) => n.startsWith("Event"));
    },

    async movedElementKeepsUpdateBar() {
      class LitMove extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.v}`; }
      }
      customElements.define("lit-move", LitMove);
      const el = new LitMove();
      document.body.append(el);
      await el.updateComplete;
      await frame();
      const got = await collect(async () => { el.v = 1; work(1); document.body.prepend(el); work(1); await el.updateComplete; });
      return names(on("Scheduler", got)).filter((n) => n.startsWith("Update"));
    },

    async invalidNameLeavesClassAlone() {
      class BadName extends HTMLElement { connectedCallback() {} }
      const before = BadName.prototype.connectedCallback;
      let threw = null;
      try { definePerf("notvalid", BadName); } catch (e) { threw = e.name; }
      return { threw, untouched: BadName.prototype.connectedCallback === before, canRetry: (() => { definePerf("now-valid", BadName); return true; })() };
    },

    // ---- Gaps found by coverage -----------------------------------------

    async productionVersionWorks() {
      const prod = await import("/dist/production/index.js");
      const prodLit = await import("/dist/production/adapters/lit.js");
      let connected = false;
      class ProdEl extends HTMLElement { connectedCallback() { connected = true; } }
      class ProdLit extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 1; prodLit.trackLitUpdates(this); }
        render() { work(0.3); return html`${this.v}`; }
      }
      customElements.define("prod-lit", ProdLit);
      const lit = new ProdLit();
      const got = await collect(async () => {
        prod.definePerf("prod-el", ProdEl);
        document.body.append(document.createElement("prod-el"), lit);
        await lit.updateComplete;
      });
      return {
        defined: customElements.get("prod-el") === ProdEl,
        connected,
        litRendered: lit.renderRoot.textContent.trim(),
        bars: got.length,
      };
    },

    async inheritedCallbacksRestoredAfterFailedDefine() {
      class BaseR extends HTMLElement { connectedCallback() {} }
      class SubR extends BaseR {}
      const baseBefore = BaseR.prototype.connectedCallback;
      let threw = null;
      try { definePerf("notvalidtoo", SubR); } catch (e) { threw = e.name; }
      return {
        threw,
        subHasOwn: Object.prototype.hasOwnProperty.call(SubR.prototype, "connectedCallback"),
        baseUntouched: BaseR.prototype.connectedCallback === baseBefore,
      };
    },

    async turnedOffAfterDefining() {
      let calls = 0;
      class LateOff extends HTMLElement { connectedCallback() { calls++; work(1); } }
      definePerf("late-off", LateOff);
      configure({ enabled: false });
      const got = await collect(() => document.body.append(document.createElement("late-off")));
      configure({ enabled: true });
      return { calls, bars: got.length };
    },

    async onlyChosenCallbacks() {
      class Picky extends HTMLElement {
        static observedAttributes = ["x"];
        connectedCallback() { work(1); }
        attributeChangedCallback() { work(1); }
      }
      instrumentElement(Picky, { callbacks: ["connectedCallback"] });
      customElements.define("picky-el", Picky);
      const el = document.createElement("picky-el");
      const got = await collect(() => { document.body.append(el); el.setAttribute("x", "1"); });
      return names(on("Components", got));
    },

    async cascadeDuringFirstUpdate() {
      class LitFirstCascade extends LitElement {
        static properties = { ready: { type: Boolean } };
        constructor() { super(); this.ready = false; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.ready}`; }
        firstUpdated() { this.ready = true; }
      }
      customElements.define("lit-first-cascade", LitFirstCascade);
      const el = new LitFirstCascade();
      const got = await collect(async () => { document.body.append(el); await el.updateComplete; await el.updateComplete; });
      return on("Scheduler", got).find((b) => b.name === "Cascading Update")?.props["Requested during"];
    },

    async removedBeforeFirstUpdate() {
      class LitGone extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.v}`; }
      }
      customElements.define("lit-gone", LitGone);
      const el = new LitGone();
      const got = await collect(async () => {
        document.body.append(el);
        el.remove(); // before Lit's first update runs
        await el.updateComplete;
        await new Promise((r) => setTimeout(r, 40));
        document.body.append(el);
        el.v = 1;
        await el.updateComplete;
      });
      return {
        rendered: el.renderRoot.textContent.trim(),
        longestUpdateWait: Math.max(0, ...on("Scheduler", got).filter((b) => b.name.startsWith("Update")).map((b) => b.duration)),
      };
    },

    async unreadablePropertyStillUpdates() {
      class LitTricky extends LitElement {
        static properties = { secret: { noAccessor: true } };
        constructor() { super(); this._secret = 0; this.locked = false; trackLitUpdates(this); }
        get secret() { if (this.locked) throw new Error("locked"); return this._secret; }
        set secret(v) { const old = this._secret; this._secret = v; this.requestUpdate("secret", old); this.locked = true; }
        render() { work(0.3); return html`${this._secret}`; }
      }
      customElements.define("lit-tricky", LitTricky);
      const el = new LitTricky();
      document.body.append(el);
      await el.updateComplete;
      el.locked = false;
      await frame();
      let error = null;
      const got = await collect(async () => { el.secret = 5; try { await el.updateComplete; } catch (e) { error = e.message; } });
      return { error, rendered: el.renderRoot.textContent.trim(), rows: on("Components", got).find((b) => b.name === "lit-tricky")?.rows };
    },

    async lightDomCustomEvent() {
      class LitTarget extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.v}`; }
      }
      customElements.define("lit-target", LitTarget);
      const target = new LitTarget();
      const button = document.createElement("div");
      document.body.append(target, button);
      await target.updateComplete;
      button.addEventListener("my-event", () => { work(1); target.v++; });
      const got = await collect(async () => { button.dispatchEvent(new CustomEvent("my-event")); await target.updateComplete; });
      return names(on("Scheduler", got)).filter((n) => n.startsWith("Event"));
    },

    async customizedBuiltIn() {
      const prod = await import("/dist/production/index.js");
      class FancyButton extends HTMLButtonElement { connectedCallback() { work(1); } }
      class PlainFancy extends HTMLButtonElement {}
      let fancy;
      const got = await collect(() => {
        definePerf("fancy-button", FancyButton, { extends: "button" });
        prod.definePerf("plain-fancy", PlainFancy, { extends: "button" });
        fancy = document.createElement("button", { is: "fancy-button" });
        document.body.append(fancy);
      });
      const made = document.createElement("button", { is: "plain-fancy" });
      return {
        devWorks: fancy instanceof FancyButton,
        prodWorks: made instanceof PlainFancy,
        bars: names(on("Components", got)),
      };
    },

    async elementsPreviewAsTags() {
      const { preview } = await import("/dist/emit.js");
      return preview(document.createElement("my-thing"));
    },

    async instrumentAllCanBeStopped() {
      const stopA = instrumentAll();
      const stopB = instrumentAll();
      class AllOne extends HTMLElement { connectedCallback() { work(0.5); } }
      class AllTwo extends HTMLElement { connectedCallback() { work(0.5); } }
      class AllThree extends HTMLElement { connectedCallback() { work(0.5); } }
      const during = await collect(() => { customElements.define("all-one", AllOne); document.body.append(new AllOne()); });
      stopA();
      const oneStopped = await collect(() => { customElements.define("all-two", AllTwo); document.body.append(new AllTwo()); });
      stopB();
      const allStopped = await collect(() => { customElements.define("all-three", AllThree); document.body.append(new AllThree()); });
      return {
        during: names(during),
        oneStopped: names(oneStopped),
        allStopped: names(allStopped),
        restored: !Object.prototype.hasOwnProperty.call(customElements, "define"),
      };
    },

    async disabledDoesNotPatch() {
      configure({ enabled: false });
      class Off extends HTMLElement { connectedCallback() {} }
      const before = Off.prototype.connectedCallback;
      definePerf("off-el", Off);
      class OffLit extends LitElement { constructor() { super(); trackLitUpdates(this); } }
      customElements.define("off-lit", OffLit);
      const el = new OffLit();
      const litUntouched = !Object.prototype.hasOwnProperty.call(el, "requestUpdate");
      configure({ enabled: undefined }); // ignored, so still off
      const stillOff = getConfig().enabled === false;
      configure({ enabled: true });
      return { untouched: Off.prototype.connectedCallback === before, litUntouched, stillOff };
    },

    // ---- Edge cases ------------------------------------------------------

    async alreadyInstrumentedClassWithBadName() {
      class Twice extends HTMLElement { connectedCallback() {} }
      instrumentElement(Twice);
      const patched = Twice.prototype.connectedCallback;
      let threw = null;
      try { definePerf("Not Valid", Twice); } catch (e) { threw = e.name; }
      return { threw, stillInstrumented: Twice.prototype.connectedCallback === patched };
    },

    async noGetName() {
      // Browsers before customElements.getName() fall back to the tag name.
      customElements.getName = undefined;
      try {
        class OldBrowser extends HTMLElement { connectedCallback() { work(0.5); } }
        definePerf("old-browser", OldBrowser);
        return names(on("Components", await collect(() => document.body.append(new OldBrowser()))));
      } finally {
        delete customElements.getName;
      }
    },

    async instrumentAllEdgeCases() {
      const out = {};
      // A hook that throws never stops the element being defined.
      let stop = instrumentAll({ onDefine() { throw new Error("hook broke"); } });
      class HookBroke extends HTMLElement { connectedCallback() { work(0.5); } }
      const got = await collect(() => { customElements.define("hook-broke", HookBroke); document.body.append(new HookBroke()); });
      out.defined = customElements.get("hook-broke") === HookBroke;
      out.bars = names(on("Components", got));
      // Called on something other than the registry: passed straight to the browser.
      try { customElements.define.call({}, "not-registry", class extends HTMLElement {}); } catch (e) { out.otherThis = e.name; }
      stop();
      stop(); // a second call does nothing
      out.restoredAfterTwoStops = !Object.prototype.hasOwnProperty.call(customElements, "define");

      // Something else wrapped define afterwards: leave their wrapper alone.
      stop = instrumentAll();
      const theirs = function define(...args) { return CustomElementRegistry.prototype.define.apply(this, args); };
      customElements.define = theirs;
      stop();
      out.keptOtherWrapper = customElements.define === theirs;
      delete customElements.define;

      // define was already an own property: put that back.
      const own = function define(...args) { return CustomElementRegistry.prototype.define.apply(this, args); };
      customElements.define = own;
      stop = instrumentAll();
      const patched = customElements.define !== own;
      stop();
      out.restoredOwn = patched && customElements.define === own;
      delete customElements.define;
      return out;
    },

    async litWithoutWeakRef() {
      class LitNoWeak extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.v}`; }
      }
      customElements.define("lit-no-weak", LitNoWeak);
      const el = new LitNoWeak();
      const button = document.createElement("button");
      button.addEventListener("click", () => { work(1); el.v++; });
      document.body.append(el, button);
      await el.updateComplete;
      const saved = window.WeakRef;
      window.WeakRef = undefined;
      try {
        const got = await collect(async () => { button.click(); await el.updateComplete; });
        return names(on("Scheduler", got)).filter((n) => n.startsWith("Event"));
      } finally {
        window.WeakRef = saved;
      }
    },

    async composedEventSeenOnce() {
      // A composed "change" event is heard by each shadow root it passes
      // through. It is still one event.
      class LitInput extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`<span @change=${() => { work(1); this.v++; }}>${this.v}</span>`; }
      }
      customElements.define("lit-input", LitInput);
      // Inside another tracked element, so the event passes two shadow roots.
      class LitInputBox extends LitElement {
        constructor() { super(); trackLitUpdates(this); }
        render() { return html`<lit-input></lit-input>`; }
      }
      customElements.define("lit-input-box", LitInputBox);
      const box = new LitInputBox();
      document.body.append(box);
      await box.updateComplete;
      const el = box.renderRoot.querySelector("lit-input");
      await el.updateComplete;
      const span = el.renderRoot.querySelector("span");
      const got = await collect(async () => {
        span.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
        await el.updateComplete;
      });
      return names(on("Scheduler", got)).filter((n) => n.startsWith("Event"));
    },

    async changeDuringRenderIsDropped() {
      class LitSelfSet extends LitElement {
        static properties = { v: { type: Number }, shadowed: { type: Number } };
        constructor() { super(); this.v = 0; this.shadowed = 0; trackLitUpdates(this); }
        render() { work(0.3); this.shadowed = this.v; return html`${this.v}`; }
      }
      customElements.define("lit-self-set", LitSelfSet);
      const el = new LitSelfSet();
      document.body.append(el);
      await el.updateComplete;
      await frame();
      const got = await collect(async () => { el.v++; await el.updateComplete; });
      const bar = on("Components", got).find((b) => b.name === "lit-self-set");
      return { scheduler: names(on("Scheduler", got)), batched: bar?.props["Changes batched"] ?? "1" };
    },

    async requestUpdateEdgeCases() {
      class LitManual extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        get broken() { throw new Error("cannot read"); }
        render() { work(0.3); return html`${this.v}`; }
      }
      customElements.define("lit-manual", LitManual);
      const el = new LitManual();
      document.body.append(el);
      await el.updateComplete;
      await frame();
      // Lit 3's standard decorators pass the new value in, rather than
      // leaving it to be read from the element.
      const got = await collect(async () => { el.requestUpdate("v", 0, undefined, true, 0); el.requestUpdate("v", 0, undefined, true, 7); await el.updateComplete; });
      // A property that cannot be read: the element's own error comes through.
      let error = null;
      try { el.requestUpdate("broken", 1); } catch (e) { error = e.message; }
      await el.updateComplete;
      const bar = on("Components", got).find((b) => b.name === "lit-manual" && b.color.startsWith("primary"));
      return { drawn: Boolean(bar), batched: bar?.props["Changes batched"] ?? null, error };
    },

    async trackedFromInsideAnUpdate() {
      class LitLate extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; }
        willUpdate() { if (!this.tracked) { this.tracked = true; trackLitUpdates(this); } }
        render() { work(0.3); return html`${this.v}`; }
      }
      customElements.define("lit-late", LitLate);
      const el = new LitLate();
      const first = await collect(async () => { document.body.append(el); await el.updateComplete; });
      const second = await collect(async () => { el.v++; await el.updateComplete; });
      return {
        rendered: el.renderRoot.textContent.trim(),
        // Leave out effects bars, which appear under load.
        first: names(on("Components", first).filter((b) => !b.color.startsWith("secondary"))),
        second: names(on("Components", second).filter((b) => !b.color.startsWith("secondary"))).filter((n) => n === "lit-late"),
      };
    },

    async trackingFailureNeverBreaksTheElement() {
      class LitClockBreaks extends LitElement {
        static properties = { v: { type: Number } };
        constructor() { super(); this.v = 0; trackLitUpdates(this); }
        render() { work(0.3); return html`${this.v}`; }
        // Break the clock after the element's own work, so only the
        // tracking that runs afterwards sees it.
        updated() { if (this.breakClock) performance.now = () => { throw new Error("no clock"); }; }
      }
      customElements.define("lit-clock-breaks", LitClockBreaks);
      const el = new LitClockBreaks();
      document.body.append(el);
      await el.updateComplete;
      let error = null;
      try {
        el.breakClock = true;
        el.v = 5;
        await el.updateComplete;
      } catch (e) {
        error = e.message;
      } finally {
        delete performance.now;
        el.breakClock = false;
      }
      const after = await collect(async () => { el.v = 6; await el.updateComplete; });
      return {
        error,
        rendered: el.renderRoot.textContent.trim(),
        stillTracked: names(on("Scheduler", after)).filter((n) => n === "Render"),
      };
    },
  };

  const results = {};
  for (const [name, fn] of Object.entries(scenarios)) {
    try { results[name] = { ok: true, value: await fn() }; }
    catch (e) { results[name] = { ok: false, error: String(e?.stack ?? e) }; }
  }
  window.__results = results;
</script>
</body>
